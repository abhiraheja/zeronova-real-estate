# ================================================
# DEV — ZeroNovaRealEstate API (Real Estate) → the dev server
# ================================================
#   Build  -> GitHub-hosted runner. ZeroNovaPackages is a local project reference
#             (../ZeroNovaPackages), so it is cloned and passed as the
#             `zeronovapackages` build context the Dockerfile copies from.
#             Image goes to the wealthgrow-qa Artifact Registry.
#   Deploy -> SSH into the dev server (wealthgrowai-dev), bump
#             EVENT_ZERONOVA_REAL_STATE_VERSION in ~/server/.env and
#             `docker compose up -d zeronova-real-estate`.
#
# Connection details live on the 'saarvix-dev' GitHub Environment — see the
# header of build-deploy.yml for the full list.
name: Deploy — DEV

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev-ssh
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # build-deploy.yml's Build job asks for it (keyless prod pushes); unused on dev

jobs:
  pipeline:
    # abhiraheja wali mirror copy me ye workflow nahi chalega
    if: github.repository_owner == 'WealthgrowTech'
    uses: ./.github/workflows/build-deploy.yml
    with:
      build_env: dev
      environment: saarvix-dev
      deploy_mode: ssh
      service_name: zeronova-real-estate
      image_name: zeronova-real-estate
      env_var_key: EVENT_ZERONOVA_REAL_STATE_VERSION
      dockerfile_path: ZeroNovaRealEstate.Api/Dockerfile
      # Public NuGet only; ZeroNova's own packages come from the build context below.
      package_feed: none
      build_contexts: |
        zeronovapackages=WealthgrowTech/ZeroNovaPackages@main
      # Dev images live in the wealthGrow-qa project, not saarvix-499809.
      gcp_registry: asia-south2-docker.pkg.dev/wealthgrow-qa/wealthgrow-qa
    secrets: inherit
