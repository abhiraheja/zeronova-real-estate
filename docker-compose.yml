# zeronova-real-estate — local Docker run (the API only; Core and the app run from ../zeronova-core).
#
#   docker compose up --build -d        # API http://localhost:5140
#
# Prerequisites: `gcloud auth application-default login` (secrets come from Secret Manager, project wealthgrow-qa)
# and ../ZeroNovaPackages checked out next to this repo. Nothing secret is in this file.

name: zeronova-real-estate

services:
  zeronova-real-estate:
    build:
      context: .
      dockerfile: ZeroNovaRealEstate.Api/Dockerfile
      additional_contexts:
        zeronovapackages: ../ZeroNovaPackages
    image: zeronova-real-estate:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-adc.json
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/secrets/gcp-adc.json:ro
    ports:
      - "5140:8080"
    restart: unless-stopped
